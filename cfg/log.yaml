version: 1
formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
handlers:
  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: simple
    filename: 'log/server.log'
loggers:
  Server:
    level: DEBUG
    handlers: [file]
    propagate: no
root:
  level: DEBUG